[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ── RUNNING services ──────────────────────────────────────────────────────

[program:paperclip]
# Paperclip harness API: the agent control-plane server (port 3000)
command=node dist/index.js
directory=/app
environment=NODE_ENV="production",PORT="3000"
stdout_logfile=/var/log/supervisor/paperclip.log
stderr_logfile=/var/log/supervisor/paperclip.err
autostart=true
autorestart=true
priority=100

[program:sandbox]
# AIO Sandbox: spawn the official container via Docker socket
# Requires /var/run/docker.sock mounted from host
command=bash -c "\
  echo '[sandbox] Checking Docker availability...' && \
  if command -v docker &> /dev/null && [ -S /var/run/docker.sock ]; then \
    echo '[sandbox] Docker available — spawning AIO Sandbox container...' && \
    docker run --security-opt seccomp=unconfined --rm -d \
      --name paperclip-sandbox \
      -p 8080:8080 \
      -p 5900:5900 \
      -p 8888:8888 \
      -p 8200:8200 \
      -p 9222:9222 \
      -v /workspace:/home/gem/workspace \
      -e TZ=Asia/Singapore \
      -e DISPLAY_WIDTH=1280 \
      -e DISPLAY_HEIGHT=1024 \
      -e WORKSPACE=/home/gem/workspace \
      -e DISABLE_JUPYTER=false \
      -e DISABLE_CODE_SERVER=false \
      ghcr.io/agent-infra/sandbox:latest \
      && echo '[sandbox] AIO Sandbox started successfully' || \
      echo '[sandbox] Failed to start AIO Sandbox'; \
  else \
    echo '[sandbox] Docker socket not available — AIO Sandbox not started.'; \
    echo '[sandbox] Available at: ghcr.io/agent-infra/sandbox:latest'; \
    echo '[sandbox] To enable: mount /var/run/docker.sock to container'; \
    sleep infinity; \
  fi"
stdout_logfile=/var/log/supervisor/sandbox-stdout.log
stderr_logfile=/var/log/supervisor/sandbox-stderr.log
autostart=true
autorestart=false
priority=200

# ── AVAILABLE (pre-installed, on $PATH, invoke on-demand) ──────────────────
# Invoke via: docker exec paperclip-agent <command>
#
# Hermes / OpenClaw:
#   docker exec paperclip-agent openclaw gateway start --port 18790
#   docker exec paperclip-agent openclaw gateway status
#
# Claude Code:
#   docker exec paperclip-agent claude --help
#   docker exec -it paperclip-agent claaude
#
# Codex:
#   docker exec paperclip-agent codex --help
#
# Cursor:
#   docker exec paperclip-agent cursor --help
#
# Gemini:
#   docker exec paperclip-agent gemini --help
#
# OpenCode:
#   docker exec paperclip-agent opencode --help