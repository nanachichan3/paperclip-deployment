[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ── RUNNING services ──────────────────────────────────────────────────────

[program:paperclip]
# Paperclip harness API: the agent control-plane server (port 3000)
# Connects to: paperclip.rachkovan.com (SaaS) or self-hosted
command=node dist/index.js
directory=/app
environment=NODE_ENV="production",PORT="3000"
stdout_logfile=/var/log/supervisor/paperclip.log
stderr_logfile=/var/log/supervisor/paperclip.err
autostart=true
autorestart=true
priority=100

[program:sandbox]
# AIO Sandbox: browser + terminal + file + MCP + VNC + Jupyter
# Connects to the official ghcr.io/agent-infra/sandbox container
# Uses host Docker socket (mount /var/run/docker.sock) to spawn sandbox
command=bash -c "\
  if command -v docker &> /dev/null && [ -S /var/run/docker.sock ]; then \
    docker run --security-opt seccomp=unconfined --rm -d \
      --name paperclip-sandbox \
      -p 8080:8080 \
      -p 5900:5900 \
      -p 8888:8888 \
      -p 8200:8200 \
      -p 9222:9222 \
      -v /workspace:/home/gem/workspace \
      -e TZ=Asia/Singapore \
      -e DISPLAY_WIDTH=1280 \
      -e DISPLAY_HEIGHT=1024 \
      ghcr.io/agent-infra/sandbox:latest; \
  else \
    echo 'Docker not available — AIO Sandbox not started (available via ghcr.io/agent-infra/sandbox:latest)'; \
  fi"
stdout_logfile=/var/log/supervisor/sandbox-stderr.log
stderr_logfile=/var/log/supervisor/sandbox.log
autostart=true
autorestart=false
priority=200

# ── AVAILABLE (pre-installed, on $PATH, invoke on-demand) ──────────────────
# These are installed but NOT started by supervisor.
# Invoke via: docker exec paperclip-agent openclaw gateway start --port 18790
#             docker exec paperclip-agent claude [args]
#             docker exec paperclip-agent codex [args]
#             docker exec paperclip-agent gemini [args]
#             docker exec paperclip-agent opencode [args]
#             docker exec paperclip-agent cursor [args]
#
# Or from inside the container (attach):
#   docker exec -it paperclip-agent /bin/bash