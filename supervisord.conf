[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ── RUNNING services ──────────────────────────────────────────────────────

[program:paperclip]
# Paperclip product API server
command=gosu node node --import "./server/node_modules/tsx/dist/loader.mjs" server/dist/index.js
directory=/app
environment=NODE_ENV="production",HOME="/paperclip",HOST="0.0.0.0",PORT="3100"
stdout_logfile=/var/log/supervisor/paperclip.log
stderr_logfile=/var/log/supervisor/paperclip.err
autostart=true
autorestart=true
priority=100

[program:hermes]
# Hermes = OpenClaw agent gateway (connects to Paperclip as an adapter)
# Runs on port 18790, Paperclip connects to it via openclaw-gateway adapter
command=gosu node openclaw gateway start --port 18790
environment=NODE_ENV="production"
stdout_logfile=/var/log/supervisor/hermes.log
stderr_logfile=/var/log/supervisor/hermes.err
autostart=true
autorestart=true
priority=200

# ── AVAILABLE (pre-installed, on $PATH, invoke on-demand) ──────────────────
# Invoke via: docker exec paperclip-agent <command>
#
# Claude Code:
#   docker exec paperclip-agent claude --help
#
# Codex:
#   docker exec paperclip-agent codex --help
#
# Cursor:
#   docker exec paperclip-agent cursor --help
#   docker exec paperclip-agent @cursor.com/cli --help
#
# Gemini:
#   docker exec paperclip-agent gemini --help
#
# OpenCode:
#   docker exec paperclip-agent opencode --help
#
# OpenClaw / Hermes CLI:
#   docker exec paperclip-agent openclaw --help